version: 1

# API-specific pages are owned by the implementation comments below.
api_comments:
  - guide: guides/fields/introduction.md
    source: lib/graphql/schema/field.rb
    constant: GraphQL::Schema::Field
    required_sections:
      - "## Field Names"
      - "## Field Return Type"
      - "## Field Resolution"
      - "## Field Parameter Default Values"
  - guide: guides/fields/arguments.md
    source: lib/graphql/schema/argument.rb
    constant: GraphQL::Schema::Argument
    required_sections:
      - "## Nullability"
      - "## Default Values"
      - "## Valid Argument Types"
  - guide: guides/schema/definition.md
    source: lib/graphql/schema.rb
    constant: GraphQL::Schema
    kind: hybrid
    rationale: Keep setup, lazy-loading, and production walkthroughs as a standalone tutorial while the schema configuration contracts live in GraphQL::Schema comments.
    max_lines: 140
    required_sections:
      - "Schema configuration reference"
      - "migrated from guides/schema/definition.md"
  - guide: guides/queries/executing_queries.md
    source: lib/graphql/query.rb
    constant: GraphQL::Query
    kind: hybrid
    rationale: Keep variables, context, scoped context, and root-value walkthroughs as a tutorial while constructor and execution options are documented on the API methods.
    max_lines: 220
    required_sections:
      - "API-specific portions"
      - "migrated from guides/queries/executing_queries.md"

# These files are generated API snapshots from the former YARD pipeline.
# They are excluded from the RDoc site; the Ruby source comments are canonical.
generated_api:
  - guides/yardoc/**/*.md

standalone_policy: Every remaining guide is reviewed as a tutorial, integration, or cross-cutting explanation. API contracts belong in implementation comments and are linked from these pages.

