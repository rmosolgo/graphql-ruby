version: 1
source: YARD public API inventory generated before the RDoc migration (f1a619de08)
policy: Public YARD objects with documented comments; RDoc auto-generated constructors and dynamic visibility changes are explicitly reviewed below.
allowlist_review:
  reviewed_at: "2026-08-27"
  missing_reason: "YARD documented dynamic or nested objects whose RDoc representation is intentionally different, plus APIs explicitly marked private with :nodoc: during the migration; each entry is retained here so a future migration can review it explicitly."
  extra_reason: RDoc-generated entries for constructors, inherited/dynamic APIs, objects that YARD represented under a different kind, or APIs documented on master after this baseline was captured; each entry is retained here so unexpected additions fail the check.
