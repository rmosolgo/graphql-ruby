name: RDoc Documentation

on:
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  BUNDLE_GEMFILE: gemfiles/docs.gemfile

jobs:
  build:
    name: Build and verify RDoc documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # One invocation so build_twice reuses the site docs:check already built
      - name: Run strict documentation checks and check reproducible output
        run: bundle exec rake docs:check docs:build_twice
      - name: Check gem installation documentation
        run: bundle exec ruby tool/docs/gem_install_check.rb
      - name: Upload RDoc artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdoc-site
          path: |
            tmp/rdoc-site
            tmp/rdoc-api-compatibility.json
            tmp/rdoc-link-report.json
            tmp/rdoc-ref-report.json
