name: RDoc Documentation

on:
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  BUNDLE_GEMFILE: gemfiles/docs.gemfile

jobs:
  build:
    name: Build and verify RDoc documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its base parent, to see what the PR changed
          fetch-depth: 2
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # Only changes to the docs tooling can make the output non-reproducible,
      # so other PRs skip the second build.
      - name: Check for documentation tooling changes
        id: tooling
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- tool/docs Rakefile .rdoc_options; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # One invocation so build_twice reuses the site docs:check already built
      - name: Run strict documentation checks
        env:
          BUILD_TWICE: ${{ github.event_name != 'pull_request' || steps.tooling.outputs.changed == 'true' }}
        run: |
          tasks=(docs:check)
          if [ "$BUILD_TWICE" = "true" ]; then
            tasks+=(docs:build_twice)
          fi
          bundle exec rake "${tasks[@]}"
      - name: Check gem installation documentation
        run: bundle exec ruby tool/docs/gem_install_check.rb
      - name: Upload RDoc artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdoc-site
          path: |
            tmp/rdoc-site
            tmp/rdoc-api-compatibility.json
            tmp/rdoc-link-report.json
            tmp/rdoc-ref-report.json
